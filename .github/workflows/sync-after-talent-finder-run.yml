name: Sync na Talent Finder run (handmatig)

# The automatic publication pipeline is now owned by
# .github/workflows/sync-talent-finder-results.yml.
# Keep this workflow available as a manual recovery/diagnostic tool, but do not
# run a second automatic sync against the same report because that can race the
# primary pipeline and create duplicate Run archives.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate newest real report without publishing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports=sorted(Path('talent-finder-runs').glob('*-automated-run.json'),key=lambda p:p.stat().st_mtime)
          if not reports: raise SystemExit('FOUT: geen automatisch Talent Finder report.')
          p=reports[-1]; d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('jsonValid') is not True: raise SystemExit('FOUT: report is niet geldig JSON verklaard.')
          print('Laatste report geldig:',p)
          print('Status:',d.get('status'))
          print('Kandidaten:',d.get('candidatesScreened'))
          print('Approved:',len(d.get('approvedPlayers') or []))
          print('Rejected:',len(d.get('rejectedPlayers') or []))
          print('Technische fouten:',len(d.get('runnerErrors') or []))
          PY
