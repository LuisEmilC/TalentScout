name: Talent Finder resultaten naar database

on:
  push:
    paths:
      - 'talent-finder-runs/**/*.json'
      - 'talent-finder-runs/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: talent-finder-database-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and archive Talent Finder run
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, data):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def names(items):
              return {str(x.get('name', '')).strip().lower() for x in items if isinstance(x, dict) and str(x.get('name', '')).strip()}

          def name_of(item):
              return str(item.get('name', '')).strip() if isinstance(item, dict) else ''

          def slug(name):
              s = re.sub(r'[^A-Za-z0-9]+', '-', name).strip('-')
              return s or 'unknown-player'

          before = os.environ.get('BEFORE_SHA', '')
          after = os.environ.get('AFTER_SHA', '')
          reports = []
          if before and after and before != '0000000000000000000000000000000000000000':
              try:
                  changed = subprocess.check_output(['git', 'diff', '--name-only', before, after], text=True).splitlines()
                  reports = [p for p in changed if p.startswith('talent-finder-runs/') and p.endswith('.json') and '/Run ' not in p]
              except Exception as e:
                  print('Diff lookup failed:', e)
          if not reports:
              reports = [str(p) for p in Path('talent-finder-runs').glob('*.json')]
          if not reports:
              print('Geen Talent Finder rapport gevonden; niets te synchroniseren.')
              raise SystemExit(0)

          reports.sort(key=lambda p: Path(p).stat().st_mtime)
          report_path = Path(reports[-1])
          report = load(report_path)
          status = str(report.get('status', '')).strip()

          # Technical write failures are never player rejections and never create player files.
          if status == 'blocked_before_database_write':
              print(f'OVERGESLAGEN: {report_path} bevat een technische write-block.')
              raise SystemExit(0)

          approved_items = report.get('approvedPlayers', report.get('published', [])) or []
          rejected_items = report.get('rejectedPlayers', report.get('rejected', [])) or []
          if not isinstance(approved_items, list) or not isinstance(rejected_items, list):
              raise SystemExit('Rapport bevat geen geldige approved/rejected arrays.')

          # Every newly published player must explicitly prove 7+ checks and 2+ sources.
          for item in approved_items:
              if not isinstance(item, dict):
                  raise SystemExit('Ongeldig approvedPlayers-record.')
              checks = item.get('checksPassed')
              if isinstance(checks, int):
                  check_count = checks
              elif isinstance(checks, list):
                  check_count = len(checks)
              else:
                  check_count = 0
              sources = item.get('sources') or item.get('supportingSources')
              if check_count < 7:
                  raise SystemExit(f"PUBLICATIE GEBLOKKEERD: {item.get('name', '')} heeft minder dan 7 expliciete checks.")
              if not isinstance(sources, list) or len(sources) < 2:
                  raise SystemExit(f"PUBLICATIE GEBLOKKEERD: {item.get('name', '')} heeft minder dan 2 bronnen.")
              verification = item.get('verification', {})
              if item.get('verificationStatus', 'verified') != 'verified' and verification.get('status') != 'verified':
                  raise SystemExit(f"PUBLICATIE GEBLOKKEERD: {item.get('name', '')} is niet expliciet verified.")

          approved = load('approved-players/players.json')
          verified = load('verified-players.json')
          rejected = load('rejected-candidates.json')
          rejected_players = load('rejected-players/players.json')
          for db, label in [(approved,'approved'),(verified,'verified'),(rejected,'rejected'),(rejected_players,'rejected-players')]:
              if not isinstance(db, dict):
                  raise SystemExit(f'{label}: root moet een object zijn.')
          approved.setdefault('players', [])
          verified.setdefault('players', [])
          rejected.setdefault('candidates', [])
          rejected_players.setdefault('candidates', [])

          baseline_verified = names(verified['players'])
          baseline_approved = names(approved['players'])
          run_date = str(report.get('runStartedAt', report.get('runAt', '')))[:10] or datetime.now(timezone.utc).strftime('%Y-%m-%d')

          def make_player(item):
              player = dict(item)
              player.setdefault('id', f"talent-finder:{name_of(item).lower().replace(' ', '-')}")
              player.setdefault('nationality', item.get('nationality') or item.get('country'))
              player.setdefault('country', item.get('country'))
              player.setdefault('sources', item.get('sources') or item.get('supportingSources') or [])
              checks = item.get('checksPassed')
              if isinstance(checks, int):
                  checks = [f'check-{i}' for i in range(1, checks + 1)]
              player['verification'] = {
                  'status': 'verified',
                  'checkedAt': run_date,
                  'checksPassed': checks or []
              }
              return player

          changed_db = False
          for item in approved_items:
              name = name_of(item)
              if not name:
                  raise SystemExit('PUBLICATIE GEBLOKKEERD: approved player zonder naam.')
              player = make_player(item)
              for db in (approved, verified):
                  existing = next((p for p in db['players'] if name_of(p).lower() == name.lower()), None)
                  if existing:
                      existing.update(player)
                  else:
                      db['players'].append(player)
                  db['updatedAt'] = run_date
              rejected['candidates'] = [c for c in rejected['candidates'] if name_of(c).lower() != name.lower()]
              rejected_players['candidates'] = [c for c in rejected_players['candidates'] if name_of(c).lower() != name.lower()]
              changed_db = True

          real_rejects = []
          for item in rejected_items:
              name = name_of(item)
              if not name:
                  continue
              reason = str(item.get('reason', ''))
              if 'write' in reason.lower() and 'blocked' in reason.lower():
                  print(f'Niet als reject opgeslagen: technische write-block bij {name}')
                  continue
              candidate = dict(item)
              candidate['supportingSources'] = candidate.get('supportingSources') or candidate.get('sources') or []
              candidate['checkedAt'] = candidate.get('checkedAt') or run_date
              candidate.setdefault('failedControl', '7-voudige verificatie')
              real_rejects.append(candidate)
              for db in (rejected, rejected_players):
                  existing = next((c for c in db['candidates'] if name_of(c).lower() == name.lower()), None)
                  if existing:
                      existing.update(candidate)
                  else:
                      db['candidates'].append(candidate)
                  db['updatedAt'] = run_date
              changed_db = True

          # Never silently delete a previously verified/approved player.
          missing_verified = baseline_verified - names(verified['players'])
          missing_approved = baseline_approved - names(approved['players'])
          if missing_verified or missing_approved:
              raise SystemExit(f'PRESERVATION CHECK FAILED: verified={sorted(missing_verified)} approved={sorted(missing_approved)}')

          # Sequential Run number: max existing Run N + 1.
          run_numbers = []
          for root in (Path('approved-players'), Path('rejected-players')):
              if root.exists():
                  for p in root.iterdir():
                      m = re.fullmatch(r'Run (\d+)', p.name)
                      if m and p.is_dir():
                          run_numbers.append(int(m.group(1)))
          run_number = max(run_numbers, default=0) + 1
          run_label = f'Run {run_number}'

          # Archive the exact result of this run using the same Run number on both sides.
          approved_dir = Path('approved-players') / run_label
          rejected_dir = Path('rejected-players') / run_label
          approved_dir.mkdir(parents=True, exist_ok=True)
          rejected_dir.mkdir(parents=True, exist_ok=True)

          for item in approved_items:
              name = name_of(item)
              if name:
                  save(approved_dir / f'{slug(name)}.json', make_player(item))

          for item in real_rejects:
              name = name_of(item)
              if name:
                  save(rejected_dir / f'{slug(name)}.json', item)

          run_meta = {
              'runNumber': run_number,
              'sourceReport': str(report_path),
              'runStartedAt': report.get('runStartedAt', report.get('runAt')),
              'runCompletedAt': report.get('runCompletedAt'),
              'status': status or 'completed',
              'approvedPlayers': len(approved_items),
              'rejectedPlayers': len(real_rejects),
              'technicalWriteFailureIsRejection': False
          }
          save(approved_dir / 'run.json', run_meta)
          save(rejected_dir / 'run.json', run_meta)

          # Save aggregate databases even when only run archive metadata changed.
          for f, data in [
              ('approved-players/players.json', approved),
              ('verified-players.json', verified),
              ('rejected-candidates.json', rejected),
              ('rejected-players/players.json', rejected_players)
          ]:
              save(f, data)
              load(f)
              print('Valid JSON:', f)

          print(f'RUN NUMBER: {run_number}')
          print(f'APPROVED ARCHIVE: {approved_dir}')
          print(f'REJECTED ARCHIVE: {rejected_dir}')
          print(f'Goedgekeurd: {len(approved_items)}')
          print(f'Echte rejects: {len(real_rejects)}')
          print('Preservation check: OK')
          PY

      - name: Validate all TalentScout JSON databases
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          roots = [Path('approved-players'), Path('rejected-players'), Path('talent-finder-runs')]
          for root in roots:
              if root.exists():
                  for f in root.rglob('*.json'):
                      json.loads(f.read_text(encoding='utf-8'))
                      print(f, 'OK')
          for f in ['approved-players/players.json','verified-players.json','rejected-candidates.json','rejected-players/players.json']:
              data = json.loads(Path(f).read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{f}: root moet object zijn')
          print('Alle TalentScout JSON-bestanden zijn geldig.')
          PY

      - name: Commit database and Run archive
        run: |
          if git diff --quiet; then
            echo 'Geen wijzigingen om te committen.'
            exit 0
          fi
          git config user.name 'TalentScout Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add approved-players rejected-players verified-players.json rejected-candidates.json talent-finder-runs
          git commit -m 'Archive Talent Finder run and sync databases'
          git push
